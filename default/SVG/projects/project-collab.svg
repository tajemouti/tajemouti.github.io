  <text x="84" y="252" fill="#64748b" font-family="monospace" font-size="12">05</text>
  <text x="142" y="252" fill="#34d399" font-family="monospace" font-size="12">return { conflictFree: true, latencyMs: 6 };</text>

  <text x="84" y="282" fill="#64748b" font-family="monospace" font-size="12">06</text>
  <text x="134" y="282" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
  <text x="84" y="308" fill="#64748b" font-family="monospace" font-size="12">07</text>
  <text x="114" y="308" fill="#38bdf8" font-family="monospace" font-size="12">}</text>

