  <text x="84" y="124" fill="#64748b" font-family="monospace" font-size="12">01</text>
  <text x="114" y="124" fill="#c084fc" font-family="monospace" font-size="12">import <tspan fill="#f8fafc">{ YDoc, WebrtcProvider }</tspan> from <tspan fill="#34d399">'yjs-crdt'</tspan>;</text>

