<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="orange7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg7)"/>
  <circle cx="400" cy="250" r="220" fill="#38bdf8" fill-opacity="0.1"/>
  <!-- CloudOps Topology Canvas -->
  <rect x="44" y="36" width="712" height="428" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#334155" stroke-width="1.5"/>
  <text x="72" y="74" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">CloudOps Mesh — Zero-Downtime K8s Topology</text>
  <rect x="596" y="54" width="136" height="28" rx="14" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/>
  <text x="664" y="72" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">● 12/12 PODS READY</text>

  <!-- Connection Edges -->
  <g stroke="#ff6b00" stroke-width="2.5" stroke-dasharray="6 6">
    <line x1="210" y1="240" x2="360" y2="165"/>
    <line x1="210" y1="240" x2="360" y2="315"/>
  </g>
  <g stroke="#38bdf8" stroke-width="2.5">
    <line x1="440" y1="165" x2="585" y2="165"/>
    <line x1="440" y1="315" x2="585" y2="315"/>
    <line x1="400" y1="205" x2="400" y2="275"/>
  </g>

  <!-- Ingress Node -->
  <rect x="76" y="192" width="144" height="96" rx="14" fill="#1e293b" stroke="url(#orange7)" stroke-width="2"/>
  <text x="148" y="228" fill="#ff9838" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">EDGE INGRESS</text>
  <text x="148" y="252" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Cloudflare + Envoy</text>
  <text x="148" y="272" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">TLS 1.3 • WAF</text>

  <!-- Service Mesh Nodes -->
  <rect x="330" y="116" width="150" height="96" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="405" y="150" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">API WORKER POOL</text>
  <text x="405" y="174" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Go + gRPC Mesh</text>
  <text x="405" y="194" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">CPU: 28% • 6 Pods</text>

  <rect x="330" y="268" width="150" height="96" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="405" y="302" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">EVENT STREAM</text>
  <text x="405" y="326" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Kafka + Workers</text>
  <text x="405" y="346" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Lag: 0ms • 6 Pods</text>

  <!-- Storage Nodes -->
  <rect x="576" y="116" width="152" height="96" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="652" y="150" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">PRIMARY CLUSTER</text>
  <text x="652" y="174" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL HA</text>
  <text x="652" y="194" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Multi-AZ Sync</text>

  <rect x="576" y="268" width="152" height="96" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="652" y="302" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">CACHE LAYER</text>
  <text x="652" y="326" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Redis Cluster</text>
  <text x="652" y="346" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">99.4% Hit Ratio</text>

  <!-- Bottom CI/CD Pipeline Status Bar -->
  <rect x="76" y="394" width="652" height="44" rx="10" fill="#090d16" stroke="#334155"/>
  <text x="98" y="420" fill="#e2e8f0" font-family="monospace" font-size="11">GitOps Release #418  →  Build ✓  →  Canary 10% ✓  →  Prometheus SLO Check ✓  →  <tspan fill="#34d399" font-weight="700">Production Promoted</tspan></text>
</svg>
