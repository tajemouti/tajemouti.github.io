    <rect x="184" y="192" width="14" height="100" rx="4"/>
    <rect x="208" y="164" width="14" height="128" rx="4"/>
    <rect x="232" y="176" width="14" height="116" rx="4"/>
    <rect x="256" y="210" width="14" height="82" rx="4"/>
    <rect x="280" y="186" width="14" height="106" rx="4"/>
