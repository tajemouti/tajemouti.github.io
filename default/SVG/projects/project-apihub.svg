<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ff9838"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <circle cx="650" cy="390" r="220" fill="#ff6b00" fill-opacity="0.14"/>
  <!-- API Gateway Split Window -->
  <rect x="44" y="36" width="712" height="428" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Top Request Bar -->
  <rect x="64" y="56" width="672" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="76" y="67" width="64" height="24" rx="6" fill="url(#orange4)"/>
  <text x="108" y="83" fill="#fff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">POST</text>
  <text x="156" y="83" fill="#e2e8f0" font-family="monospace" font-size="13">https://api.devgate.io/v2/webhooks/dispatch</text>
  <rect x="628" y="67" width="92" height="24" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="674" y="83" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">200 OK • 19ms</text>

  <!-- Left Endpoint Explorer -->
  <rect x="64" y="118" width="210" height="324" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
  <text x="82" y="144" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">OPENAPI 3.1 ENDPOINTS</text>
  <rect x="78" y="160" width="182" height="32" rx="6" fill="#ff6b00" fill-opacity="0.18" stroke="#ff6b00"/>
  <text x="90" y="180" fill="#ff9838" font-family="monospace" font-size="11" font-weight="700">POST /v2/webhooks</text>
  <rect x="78" y="202" width="182" height="32" rx="6" fill="#0f172a"/>
  <text x="90" y="222" fill="#38bdf8" font-family="monospace" font-size="11">GET  /v2/keys/rotate</text>
  <rect x="78" y="244" width="182" height="32" rx="6" fill="#0f172a"/>
  <text x="90" y="264" fill="#34d399" font-family="monospace" font-size="11">GET  /v2/metrics/usage</text>
  <rect x="78" y="286" width="182" height="32" rx="6" fill="#0f172a"/>
  <text x="90" y="306" fill="#f43f5e" font-family="monospace" font-size="11">DEL  /v2/tokens/{id}</text>

  <!-- Right JSON Response Payload Viewer -->
  <rect x="290" y="118" width="446" height="324" rx="10" fill="#090d16" stroke="#334155"/>
  <text x="312" y="146" fill="#64748b" font-family="monospace" font-size="12">// Response Payload (application/json)</text>
  <text x="312" y="174" fill="#f8fafc" font-family="monospace" font-size="13">{</text>
  <text x="332" y="200" fill="#38bdf8" font-family="monospace" font-size="13">"status": <tspan fill="#34d399">"delivered"</tspan>,</text>
  <text x="332" y="226" fill="#38bdf8" font-family="monospace" font-size="13">"delivery_id": <tspan fill="#ff9838">"wh_99481a7c2f"</tspan>,</text>
  <text x="332" y="252" fill="#38bdf8" font-family="monospace" font-size="13">"rate_limit": {</text>
  <text x="356" y="278" fill="#cbd5e1" font-family="monospace" font-size="13">"remaining": <tspan fill="#f59e0b">4982</tspan>,</text>
  <text x="356" y="304" fill="#cbd5e1" font-family="monospace" font-size="13">"policy": <tspan fill="#34d399">"token_bucket_redis"</tspan></text>
  <text x="332" y="330" fill="#38bdf8" font-family="monospace" font-size="13">},</text>
  <text x="332" y="356" fill="#38bdf8" font-family="monospace" font-size="13">"signature_verified": <tspan fill="#ff6b00">true</tspan></text>
  <text x="312" y="382" fill="#f8fafc" font-family="monospace" font-size="13">}</text>
</svg>
